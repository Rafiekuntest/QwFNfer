name: windows-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. windows-v1)'
        required: true
# Builds the Windows bundle exactly the way BUILD_WINDOWS.md documents:
# pip CUDA redists (no admin), generated cublas import libs, pinned llama.cpp
# with the CUDA backend, portable engine, package.ps1. Attaches the zip to the
# release. Run from the windows-port branch.
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: windows-port
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CUDA from pip wheels (no admin)
        run: |
          python -m pip install --extra-index-url https://pypi.ngc.nvidia.com nvidia-cuda-nvcc nvidia-cuda-runtime nvidia-cublas nvidia-cuda-cccl
          'CU13=' + (python -c "import nvidia.cu13, os; print(os.path.dirname(nvidia.cu13.__file__))") | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Generate cublas import libs
        shell: pwsh
        run: |
          $cu = (Get-Content $env:GITHUB_ENV | Select-String '^CU13=(.*)' | ForEach-Object { $_.Matches.Groups[1].Value }).Trim()
          "CUDIR=$cu" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          foreach ($d in 'cublas64_13.dll','cublasLt64_13.dll') {
            $base = $d -replace '\.dll$',''; $lib = ($base -replace '64_13$','') + '.lib'
            $names = dumpbin /EXPORTS "$cu\bin\x86_64\$d" |
              Select-String '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)' | ForEach-Object { $_.Matches.Groups[1].Value } |
              Where-Object { $_ -notmatch '^(ordinal|hint|RVA|name|Summary)' } | Sort-Object -Unique
            "LIBRARY $base`r`nEXPORTS`r`n" + ($names -join "`r`n") | Out-File -Encoding ascii "$env:RUNNER_TEMP\$base.def"
            lib /DEF:"$env:RUNNER_TEMP\$base.def" /OUT:"$cu\lib\x64\$lib" /MACHINE:X64
          }
      - name: Build llama.cpp (pinned mix, CUDA backend)
        shell: pwsh
        run: |
          $cu = ($env:CUDIR -replace '\\','/')
          git clone --depth 1 --branch b10798-mix-659e406 https://github.com/unslothai/llama.cpp $env:RUNNER_TEMP\llama.cpp
          cmake -S $env:RUNNER_TEMP\llama.cpp -B $env:RUNNER_TEMP\llama.cpp\build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON -DGGML_BACKEND_DL=ON -DGGML_NATIVE=OFF -DGGML_CUDA=ON `
            "-DCMAKE_CUDA_ARCHITECTURES=75;80;86;89;90;120" "-DCMAKE_CUDA_COMPILER=$cu/bin/nvcc.exe" "-DCUDAToolkit_ROOT=$cu" `
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_SERVER=OFF
          cmake --build $env:RUNNER_TEMP\llama.cpp\build --target ggml-base ggml ggml-cpu ggml-cuda llama
          "GGML_LIBS=$env:RUNNER_TEMP\llama.cpp\build\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Package bundle
        shell: pwsh
        run: |
          $env:LLAMA_CPP_ROOT = "$env:RUNNER_TEMP\llama.cpp"
          powershell -ExecutionPolicy Bypass -File scripts\package.ps1 -GgmlLibs $env:GGML_LIBS -CudaLibs "$env:CUDIR\bin\x86_64"
      - name: Smoke test (engine loads, usage prints)
        shell: pwsh
        run: |
          $env:QWFN_ZIP = "$pwd\dist\qwfnfer-windows-x86_64-cuda.zip"
          $env:QWFN_HOME = "$env:RUNNER_TEMP\qwfnfer"; $env:QWFN_BIN = "$env:RUNNER_TEMP\qbin"
          powershell -ExecutionPolicy Bypass -File scripts\install.ps1
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: true
          generate_release_notes: false
          body: |
            Windows port prerelease — see SETUP.md to install, BUILD_WINDOWS.md to build.
            Portable bundle (`/arch:AVX2`, CUDA 13 runtime + ggml backends beside the binaries).
            Requires 16 GB NVIDIA GPU, driver 580+, ~30 GB RAM, NVMe. Auto-tune measures your machine on first run.
          files: dist/qwfnfer-windows-x86_64-cuda.zip
